<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sign in to Your Account.</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <section class="form-container">
        <header class="form-header">
            <p class="logo"><a href="index.html"><span>Sports</span><span>Corner</span></a></p>
            <nav>
                <ul>
                    <li><a href="#">Help</a></li>
                    <li><a href="#">Terms</a></li>
                    <li><a href="#">Privacy</a></li>
                </ul>
            </nav>
        </header>
        <main class="form-main">
            <div id="notification-message">
                <!-- <h2>You have successful created an account</h2>
                <p>You will be redirected to log in page for log in process</p> -->
            </div>
            <div class="form-main-content">
                <h1>Sign in to Your Account</h1>
                <h3 id="fail-login-message">Fail to log in, your login email or password are incorrect</h3>
                <form action="login.html" method="post">
                    <label for="login-email">Email</label> <br>
                    <input type="text" id="login-email" name="login-email" title="Please fill out this field." required> <br>
                    <p id="login-email-correction" class="input-correction-message"></p>
                    
                    <label for="login-password">Password</label> <br>
                    <input type="password" id="login-password" name="login-password" title="Please fill out this field." required> <br>
                    <p id="login-password-correction" class="input-correction-message"></p>
                    <div class="login-form-middle-part">
                        <div>
                            <input type="checkbox" id="stay-signed" name="stay-signed" value="true" >                    
                            <label for="stay-signed">Stay signed in</label>
                        </div>
                        <p><a href="#">Forgot username</a></p>
                    </div>
                    <button type="submit" id="login-btn" name="submit">Log in</button>
                </form>
                <div class="separating-lines">
                    <hr><p> or </p><hr>
                </div>
                <a href="google.com"><button class="google-button">Sing in with Google</button></a>
                <!-- <a href="register.html"><button>Create account</button></a> -->
            </div>
        </main>

    </section>

    <script src="login.js"></script>
</body>
</html>
