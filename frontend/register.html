<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Create Your Account.</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <section class="form-container">
        <header class="form-header">
            <p class="logo"><a href="index.html"><span>Sports</span><span>Corner</span></a></p>
            <nav>
                <ul>
                    <li><a href="#">Help</a></li>
                    <li><a href="#">Terms</a></li>
                    <li><a href="#">Privacy</a></li>
                </ul>
            </nav>
        </header>
        <main class="form-main">
            <div id="notification-message">
                <!-- <h2>You have successful created an account</h2>
                <p>You will be redirected to log in page for log in process</p> -->
            </div>
            <div class="form-main-content">
                <h1>Create your account</h1>
                <p>(For Admin) Access other features in the website like post, edit and delete news. All fields are required</p>
                <form action="register.html" method="post">
                    <label for="id-number">Your employee ID number</label> <br>
                    <input type="text" id="id-number" name="id-number" title="Please fill out this field." required> <br>
                    <p id="id-number-correction" class="input-correction-message"></p>

                    <label for="register-email">Existing email</label> <br>
                    <input type="email" id="register-email" name="register-email" title="Please fill out this field." required> <br>
                    <p id="register-email-correction" class="input-correction-message"></p>
                    
                    <label for="f-name">Fist name</label> <br>
                    <input type="text" id="f-name" name="f-name" title="Please fill out this field." required> <br>
                    <p id="f-name-correction" class="input-correction-message"></p>

                    <label for="l-name">Last name</label> <br>
                    <input type="text" id="l-name" name="l-name" title="Please fill out this field." required> <br>
                    <p id="l-name-correction" class="input-correction-message"></p>

                    <label for="register-password">Password</label> <br>
                    <input type="password" id="register-password" name="register-password" title="Please fill out this field." required> <br>
                    <p id="register-password-correction" class="input-correction-message"></p>

                    <label for="confirm-password">Confirm password</label> <br>
                    <input type="password" id="confirm-password" name="confirm-password" title="Please fill out this field." required> <br>
                    <p id="confirm-password-correction" class="input-correction-message"></p>

                    <p>By creating an account, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>

                    <button type="submit" id="register-btn" name="register-btn">Create account</button>
                </form>
                <div class="separating-lines">
                    <hr><p> or </p><hr>
                </div>
                <a href="login.html"><button>Sign in instead</button></a>
            </div>
        </main>

    </section>

    <script src="authentication.js"></script>
</body>
</html>
